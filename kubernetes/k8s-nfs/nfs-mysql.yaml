apiVersion: v1
kind: Namespace
metadata:
  name: mysql
  labels:
    app: mysql

---

kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: nfs-mysql-sc-pvc
  namespace: mysql
  annotations:
    # not required, depending on whether this annotation was shown in the storage class description
    nfs.io/storage-path: nfs-mysql-sc-pvc
spec:
  storageClassName: nfs-sc-client
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 2Gi

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-config-map
  namespace: mysql
data:
  mysql.cnf: |
    [mysqld]
    lower_case_table_names=0
    character-set-server=utf8mb4
    skip-name-resolve

---

# secret
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: mysql
  labels:
    app: mysql
type: Opaque
data:
  # echo -n "123456" | base64
  password: MTIzNDU2

---

apiVersion: v1
kind: Service
metadata:
  name: mysql-svc
  namespace: mysql
spec:
  type: NodePort
  ports:
    - port: 3306
      protocol: TCP
      targetPort: 3306
  selector:
    app: mysql

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql-server
  namespace: mysql
spec:
  selector:
    matchLabels:
      app: mysql
  replicas: 1
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
      - image: mysql:8.0.21
        name: mysql-server
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: password
        ports:
        - containerPort: 3306
          name: mysql
        volumeMounts:
        - name: mysql-config
          mountPath: /etc/mysql/conf.d/
          readOnly: true
        - name: nfs-mysql-pvc
          mountPath: /var/lib/mysql
      volumes:
      - name: mysql-config
        configMap:
          name: mysql-config-map
          items:
          - key: mysql.cnf
            path: mysql.cnf
      - name: nfs-mysql-pvc
        persistentVolumeClaim:
          claimName: nfs-mysql-sc-pvc