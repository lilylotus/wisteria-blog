# /srv/http/preseed/auto.cfg
#### Localization
# 语言和地区设置
d-i debian-installer/locale string en_US
d-i keyboard-configuration/xkb-keymap select us
d-i console-setup/ask_detect boolean false

### 关键：禁用CDROM，强制网络安装
# d-i cdrom-detect/cdrom_failed boolean true
# d-i cdrom-detect/load_media boolean false
# d-i cdrom-detect/eject boolean false

# 禁用CDROM源
# d-i apt-setup/cdrom/set-first boolean false
# d-i apt-setup/cdrom/set-next boolean false
# d-i apt-setup/cdrom/set-failed boolean true
# d-i apt-setup/use_mirror boolean true

# 1. 告诉安装程序 CDROM 检测失败
d-i cdrom-detect/cdrom_failed boolean true

# 2. 不加载任何 CD/DVD 介质
d-i cdrom-detect/load_media boolean false

# 3. 禁用 eject（对于虚拟机很重要）
d-i cdrom-detect/eject boolean false

# 4. 不尝试使用 CDROM 作为安装源
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/cdrom/set-next boolean false
d-i apt-setup/cdrom/set-failed boolean true

# 5. 强制使用网络镜像
d-i apt-setup/use_mirror boolean true

# 6. 明确指定不使用 CDROM
d-i apt-setup/enable-cdrom boolean false

#### Mirror settings
# 使用本地镜像源（推荐用于大批量安装）
# d-i mirror/protocol string http
# d-i mirror/http/hostname string 192.168.99.8
# # d-i mirror/http/hostname string http.us.debian.org
# d-i mirror/http/directory string /debian
# d-i mirror/http/port string 8080
# d-i mirror/http/proxy string

d-i mirror/country string manual
d-i mirror/protocol string http
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/mirror select deb.debian.org
d-i mirror/suite string bookworm
d-i mirror/udeb/suite string bookworm
d-i mirror/udeb/components multiselect main, contrib

#### Network configuration
# 网络配置
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string debian-client
d-i netcfg/get_domain string localdomain
d-i netcfg/wireless_wep string

#### Clock and time zone setup
# 时区设置
d-i time/zone string Asia/Shanghai
d-i clock-setup/utc boolean true
d-i clock-setup/ntp boolean true

#### Partitioning
# 磁盘分区（LVM方案）
d-i partman-auto/method string lvm
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-auto/choose_recipe select atomic
d-i partman-auto-lvm/guided_size string max
d-i partman-auto/disk string /dev/sda
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-auto/init_automatically_partition select biggest_free
d-i partman-md/confirm boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

#### User setup
# 用户设置
d-i passwd/root-login boolean false
d-i passwd/user-fullname string luck User
d-i passwd/username string luck
d-i passwd/user-password password luck
d-i passwd/user-password-again password luck
d-i user-setup/allow-password-weak boolean false
d-i user-setup/encrypt-home boolean false

#### Package selection
# 软件包选择
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string \
    curl \
    wget \
    vim \
    htop \
    net-tools \
    openssh-server \
    sudo

# 更新策略
d-i pkgsel/upgrade select safe-upgrade
d-i pkgsel/update-policy select unattended-upgrades

#### Boot loader installation
# GRUB安装
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i grub-installer/bootdev string /dev/sda

#### Finishing up
# 完成设置
d-i finish-install/reboot_in_progress note
d-i debian-installer/exit/poweroff boolean false
popularity-contest popularity-contest/participate boolean false

