# /srv/http/preseed/bookworm-minimal.cfg
#### Localization
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us
d-i console-setup/ask_detect boolean false

#### Network configuration
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string debian
d-i netcfg/get_domain string localdomain
d-i netcfg/wireless_wep string

#### Mirror settings
# 关键：禁用CD检测，强制网络安装
# d-i cdrom-detect/cdrom_failed boolean true
# d-i cdrom-detect/load_media boolean false
# d-i cdrom-detect/eject boolean false
# d-i cdrom-detect/enable boolean false

d-i apt-setup/non-free boolean true
d-i apt-setup/contrib boolean true
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/cdrom/set-next boolean false
d-i apt-setup/cdrom/set-failed boolean true

# d-i debian-installer/allow_unauthenticated boolean true

# APT源配置
d-i apt-setup/use_mirror boolean false
d-i apt-setup/disable-cdrom-entries boolean true
d-i apt-setup/services-select multiselect security, updates
d-i apt-setup/security_host string security.debian.org
d-i apt-setup/security_path string /debian-security

# 镜像源配置
# d-i mirror/protocol string https
# d-i mirror/https/hostname string deb.debian.org
# d-i mirror/https/directory string /debian

# http://192.168.99.8:8080/debian
# https://www.debian.org/mirror/list
# d-i mirror/country string manual
# d-i mirror/http/hostname string mirrors.ustc.edu.cn
# d-i mirror/http/directory string /debian/
# d-i mirror/http/fallback_to_cdrom boolean false
# d-i mirror/http/proxy string

# Suite to install.
# d-i mirror/suite string testing
# Suite to use for loading installer components (optional).
# d-i mirror/udeb/suite string testing

d-i mirror/country string manual
d-i mirror/protocol string http
d-i mirror/http/hostname string 192.168.99.8
d-i mirror/http/port string 8080
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

# 安全更新（本地镜像可能不包含，使用官方源）
# d-i apt-setup/local2/repository string http://security.debian.org/debian-security trixie-security main contrib non-free non-free-firmware
# d-i apt-setup/local2/comment string Debian Security

#### Clock and time zone
d-i time/zone string Asia/Shanghai
d-i clock-setup/utc boolean true
d-i clock-setup/ntp boolean true
d-i clock-setup/ntp-server string ntp.aliyun.com

#### Partitioning
### 分区表处理
# 强制使用GPT（UEFI）或MSDOS（BIOS） gpt / msdos
d-i partman/default_filesystem string ext4

# 始终创建新分区表
d-i partman-partitioning/new_label boolean true
d-i partman-partitioning/choose_label string msdos

# 自动分区 (LVM方案)
d-i partman-auto/method string lvm
d-i partman-auto/disk string /dev/sda
d-i partman-auto-lvm/guided_size string max
# d-i partman-auto/choose_recipe select atomic

# This makes partman automatically partition without confirmation.
d-i partman-md/confirm boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman/active_partition_warn boolean false

# 禁用LVM警告（如果使用LVM）
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true

# d-i partman-auto/method string lvm
# d-i partman-auto-lvm/guided_size string max
d-i partman-auto/choose_recipe select /lib/partman/recipes/30atomic

# 自定义服务器分区
# 分区方案名称 :: \
#     最小大小 优先大小 最大大小 文件系统类型 \
#         标志{ } \
#         方法{ 方法 } 格式化{ } \
#         使用文件系统{ } 文件系统{ 文件系统类型 } \
#         挂载点{ 挂载点 } \
#     . \
d-i partman-auto/expert_recipe string \
    server-layout :: \
        1024 1 1024 ext4 \
            $primary{ } $bootable{ } \
            method{ format } format{ } \
            use_filesystem{ } filesystem{ ext4 } \
            mountpoint{ /boot } \
        . \
        2048 3 2048 linux-swap \
            $lvmok{ } \
            method{ swap } format{ } \
        . \
        10240 2 -1 ext4 \
            $lvmok{ } \
            method{ format } format{ } \
            use_filesystem{ } filesystem{ ext4 } \
            mountpoint{ / } \
        .

#### User setup
d-i passwd/root-login boolean false
d-i passwd/user-fullname string luck User
d-i passwd/username string luck
d-i passwd/user-password password luck
d-i passwd/user-password-again password luck
d-i user-setup/allow-password-weak boolean false
d-i user-setup/encrypt-home boolean false

# 将用户添加到sudo组
d-i passwd/user-default-groups string sudo

#### Package selection
# 任务选择 (Debian 12 使用 tasksel)
tasksel tasksel/first ssh-server
d-i pkgsel/include string curl wget vim htop net-tools openssh-server sudo

# 更新策略
d-i pkgsel/upgrade select full-upgrade
d-i pkgsel/update-policy select unattended-upgrades

#### Boot loader
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i grub-installer/bootdev string /dev/sda

#### Finishing up
d-i finish-install/reboot_in_progress note
popularity-contest popularity-contest/participate boolean false

# 禁用安装报告
d-i debian-installer/allow_unauthenticated boolean false