#### Debian 13 Preseed 自动安装配置文件 ####
# 适用于网络安装 (netinst)

### 本地化设置 ###
# 预配置语言、国家和区域设置
d-i debian-installer/locale string en_US.UTF-8
d-i debian-installer/language string en
d-i debian-installer/country string US
d-i debian-installer/locale string en_US.UTF-8

# 键盘配置
d-i keyboard-configuration/xkb-keymap select us
# 或使用中文键盘:
# d-i keyboard-configuration/xkb-keymap select cn

### 网络配置 ###
# 自动选择网络接口
d-i netcfg/choose_interface select auto

# 如果有多个网络接口,指定使用第一个
# d-i netcfg/choose_interface select eth0

# 主机名和域名
d-i netcfg/get_hostname string debian
d-i netcfg/get_domain string localdomain

# 禁用 WEP 密钥对话框
d-i netcfg/wireless_wep string

# 如果使用非自由固件,自动加载
d-i hw-detect/load_firmware boolean true

### 自动安装
d-i auto-install/enable boolean true
d-i debconf/priority string critical

### 镜像设置 ###
# 镜像协议 (http/ftp)
d-i mirror/protocol string http
d-i mirror/country string manual
# 使用中国镜像源 mirrors.tuna.tsinghua.edu.cn
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

d-i apt-setup/disable-cdrom-entries boolean true
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/cdrom/set-next boolean false
d-i apt-setup/cdrom/set-failed boolean false

# 明确使用网络镜像
d-i apt-setup/use_mirror boolean true

# 禁用 CD-ROM 检测
d-i cdrom-detect/try-usb boolean false
d-i cdrom-detect/load_media boolean false

# 或使用其他中国镜像:
# 阿里云: mirrors.aliyun.com
# 网易: mirrors.163.com
# 中科大: mirrors.ustc.edu.cn

### 账户设置 ###
# 跳过创建 root 账户,使用 sudo
d-i passwd/root-login boolean false

# 创建普通用户
d-i passwd/user-fullname string Luck User
d-i passwd/username string luck
# 用户密码 (明文,建议使用加密密码)
d-i passwd/user-password password luck
d-i passwd/user-password-again password luck

# 或使用加密密码 (使用 mkpasswd -m sha-512 生成)
# d-i passwd/user-password-crypted password $6$rounds=656000$...

# 如果需要 root 账户:
# d-i passwd/root-login boolean true
# d-i passwd/root-password password rootpass
# d-i passwd/root-password-again password rootpass

### 时钟和时区设置 ###
d-i clock-setup/utc boolean true
d-i time/zone string Asia/Shanghai
d-i clock-setup/ntp boolean true
d-i clock-setup/ntp-server string ntp.aliyun.com

### 分区设置 ###
# 使用 LVM 分区
d-i partman-auto/method string lvm

# 如果系统已有 LVM 或 RAID,确认删除
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
# 设置 LVM 卷组使用的磁盘空间百分比
d-i partman-auto-lvm/guided_size string max
d-i partman/choose_partition select finish

d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman-auto/confirm boolean true

# 使用整个磁盘
d-i partman-auto/disk string /dev/sda
d-i partman-auto/choose_recipe select /lib/partman/recipes/30atomic

# 自定义服务器分区
# 分区方案名称 :: \
#     最小大小 优先大小 最大大小 文件系统类型 \
#         标志{ } \
#         方法{ 方法 } 格式化{ } \
#         使用文件系统{ } 文件系统{ 文件系统类型 } \
#         挂载点{ 挂载点 } \
#     . \
d-i partman-auto/expert_recipe string \
    server-layout :: \
        1024 1 1024 ext4 \
            $primary{ } $bootable{ } \
            method{ format } format{ } \
            use_filesystem{ } filesystem{ ext4 } \
            mountpoint{ /boot } \
        . \
        2048 3 2048 linux-swap \
            $lvmok{ } \
            method{ swap } format{ } \
        . \
        10240 2 -1 ext4 \
            $lvmok{ } \
            method{ format } format{ } \
            use_filesystem{ } filesystem{ ext4 } \
            mountpoint{ / } \
        .

### 软件包选择 ###
# 不参与软件包使用调查
popularity-contest popularity-contest/participate boolean false

# 选择要安装的软件
tasksel tasksel/first multiselect standard, ssh-server

# 额外安装的软件包
d-i pkgsel/include string openssh-server vim curl wget net-tools

# 升级策略
d-i pkgsel/upgrade select full-upgrade

# 禁止自动更新
d-i pkgsel/update-policy select none

### GRUB 引导加载程序 ###
# 自动安装 GRUB 到 MBR
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i grub-installer/bootdev string /dev/sda

### 完成安装 ###
# 安装完成后不要弹出光盘提示
d-i cdrom-detect/eject boolean false

# 安装完成后重启
d-i finish-install/reboot_in_progress note

# 避免最后一条关于安装完成的消息
d-i finish-install/keep-consoles boolean true

### 高级配置 ###
# 允许安装非自由软件
# d-i apt-setup/non-free boolean true
# d-i apt-setup/contrib boolean true

# 预安装脚本 (在安装开始前执行)
# d-i preseed/early_command string \
#     echo "执行预安装命令..."

# 后安装脚本 (在安装完成后,重启前执行)
d-i preseed/late_command string \
    in-target apt-get update; \
    in-target apt-get upgrade -y; \
    in-target systemctl enable ssh; \
    echo "安装完成!" > /target/root/install.log

# 或者从网络下载并执行脚本:
# d-i preseed/late_command string \
#     wget http://your-server.com/post-install.sh -O /target/tmp/post-install.sh; \
#     in-target bash /tmp/post-install.sh

### 安全设置 ###
# 禁用 root SSH 登录 (在 late_command 中配置)
# d-i preseed/late_command string \
#     in-target sed -i 's/^#PermitRootLogin.*/PermitRootLogin no/' /etc/ssh/sshd_config

### 附加选项 ###
# 跳过安全更新镜像设置
d-i apt-setup/services-select multiselect security, updates
d-i apt-setup/security_host string security.debian.org

# 安装过程中的调试级别 (0-5, 5 为最详细)
# d-i debian-installer/priority string critical