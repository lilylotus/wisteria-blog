networks:
  nginx-network:
    driver: bridge

services:
  nginx:
    image: nginx:1.28
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./domain:/etc/nginx/conf.d
      - ./config:/etc/nginx/config
      - ./ssl:/etc/nginx/ssl
      #- ./html:/var/www/html
      #- ./logs:/var/log/nginx
    networks:
      - nginx-network