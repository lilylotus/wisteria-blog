server {
    # listen              443 ssl http2;
    # nginx v1.25
    listen              443 ssl;
    listen              [::]:443 ssl;
    http2 on;
    server_name         www.labs.yzx;
    root                /usr/share/nginx/html;

    # SSL
    ssl_certificate     /etc/nginx/ssl/labs.yzx.crt;
    ssl_certificate_key /etc/nginx/ssl/labs.yzx.key;

    # security
    include             config/security.conf;

    # logging
    access_log          /var/log/nginx/access.log combined buffer=512k flush=1m;
    error_log           /var/log/nginx/error.log warn;

    # additional config
    include             config/general.conf;
}

# non-www, subdomains redirect
server {
    listen              443 ssl;
    listen              [::]:443 ssl;
    http2 on;
    server_name         .labs.yzx;

    # SSL
    ssl_certificate     /etc/nginx/ssl/labs.yzx.crt;
    ssl_certificate_key /etc/nginx/ssl/labs.yzx.key;

    # logging
    access_log          /var/log/nginx/access.log combined buffer=512k flush=1m;
    return              301 https://www.labs.yzx$request_uri;
}

# HTTP redirect
server {
    listen      80;
    listen      [::]:80;
    server_name .labs.yzx;

    # logging
    access_log  /var/log/nginx/access.log combined buffer=512k flush=1m;
    return      301 https://www.labs.yzx$request_uri;
}