# k/kb/m/mb/g/gb are case insensitive, so you can use 1K, 1kB, 1M, 1MB, etc.
# bind 127.0.0.1 -::1

protected-mode yes
port 6379
tcp-keepalive 300
pidfile redis_6379.pid
daemonize no
requirepass redis

# debug/verbose/notice/warning/nothing
loglevel notice
logfile "redis.log"

databases 16

# 内存淘汰策略
# 2gb, 521mb, 1024kb, 1000k, etc.
maxmemory 512mb
# volatile-lru, allkeys-lru, volatile-random, allkeys-random, volatile-ttl, noeviction
# cache: allkeys-lru,  persistent: volatile-lru
# noeviction - 不淘汰，当内存不足时，新写入操作会报错，读操作正常（默认策略）
# lru：最近最少使用，近似 LRU，通过采样选择
# lfu: 最不经常使用，通过采样选择
# 内存淘汰策略
maxmemory-policy volatile-lru
# 增加采样数量提高LRU/LFU精度（但会增加CPU使用）
maxmemory-samples 10

# 启用惰性删除（Redis 4.0+）
# 各种惰性删除配置的含义(生产环境推荐配置)：
# 内存满时异步删除
lazyfree-lazy-eviction yes
# 过期键异步删除
lazyfree-lazy-expire yes
# 命令删除时异步处理
lazyfree-lazy-server-del yes
# 从库全量同步时异步清空数据
replica-lazy-flush yes

# UNLINK 等命令异步删除（Redis 6.0+）
lazyfree-lazy-user-del yes

# 小哈希使用 ziplist 的最大元素数
hash-max-ziplist-entries 512
# 小哈希使用 ziplist 的最大值(bytes)
hash-max-ziplist-value 64
# 列表使用 ziplist 的优化参数
list-max-ziplist-size -2

# RDB
# save <seconds> <changes>
save 900 1
save 300 10
save 60 10000

stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb

# AOF 持久化
appendonly yes
appendfilename "appendonly.aof"
appenddirname "appendonlydir"
# everysec|always|no
appendfsync everysec
# 重写时不进行fsync,减少磁盘I/O
no-appendfsync-on-rewrite yes
# AOF重写触发条件
auto-aof-rewrite-percentage 100
# AOF重写最小尺寸
auto-aof-rewrite-min-size 64mb
# 加载被截断的AOF文件
aof-load-truncated yes

# 混合持久化(Redis 4+)(推荐)
aof-use-rdb-preamble yes
